[project]
name = "issue-tracker"
version = "0.1.0"
description = "CLI issue tracker inspired by Google Critique with attention-based workflow"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "uuid-utils>=0.6",
    "textual>=0.40",
    "tabulate>=0.9.0",
    "boto3>=1.34",
]

[project.scripts]
issue = "issue_tracker:main"

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issue_tracker"]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
